<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User - Admin Panel</title>
    <link rel="stylesheet" href="/kaif_evibe/templates/css/admin_edit_user.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: url("/evibe_database-update_with_php/templates/images/bg.jpg") no-repeat center center/cover;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        .Nav-1 {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(13px);
            -webkit-backdrop-filter: blur(13px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 32px 0 rgba(0, 0, 0, 0.37);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
        }

        .Nav-1 h1 {
            font-size: 2rem;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            font-weight: 600;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .Search-bar {
            flex: 0 1 400px;
            margin: 0 2rem;
        }

        .Search-bar input {
            width: 100%;
            padding: 0.8rem 1.2rem;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1rem;
        }

        .Search-bar input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .Nav-Element {
            flex: 0 0 auto;
        }

        .Nav-Element ul {
            display: flex;
            list-style: none;
            gap: 1.5rem;
            margin: 0;
            padding: 0;
        }

        .Nav-Element a {
            color: #fff;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
        }

        .Nav-Element a:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .Nav-Element a i {
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        .Nav-Element a:hover i {
            transform: scale(1.1);
            color: #FF4B2B;
        }

        .logout-btn {
            background: rgba(255, 75, 43, 0.2);
            border: 1px solid rgba(255, 75, 43, 0.3);
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            color: #fff;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(255, 75, 43, 0.3);
        }
    </style>
</head>
<body>
    <!-- Glassmorphic Navigation -->
    <div class="Nav-1">
        <h1>EVibe</h1>
        
        <div class="Nav-Element">
            <ul>
                <a href="admin_panel.html"><i class="fas fa-home"></i> Dashboard</a>
                <a href="admin_register.html"><i class="fas fa-user-plus"></i> Register</a>
                <a href="admin_add_category.html"><i class="fas fa-folder-plus"></i> Add Category</a>
                <a href="admin_categories.html"><i class="fas fa-folder"></i> Categories</a>
                <a href="admin_events.html"><i class="fas fa-calendar"></i> Events</a>
                <a href="admin_users.html"><i class="fas fa-users"></i> Users</a>
                <a href="index.html" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </ul>
        </div>
    </div>

    <main class="main-content">
        <div class="content-wrapper">
            <div class="edit-container">
                <div class="edit-header">
                    <h2><i class="fas fa-edit"></i> Edit User</h2>
                    <a href="admin_users.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Users</a>
                </div>

                <form id="editForm" onsubmit="updateUser(event)">
                    <input type="hidden" id="edit_user_id" name="user_id">
                    
                    <div class="form-group">
                        <label for="edit_fullname">Full Name</label>
                        <input type="text" id="edit_fullname" name="fullname" required>
                    </div>

                    <div class="form-group">
                        <label for="edit_email">Email</label>
                        <input type="email" id="edit_email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="edit_contact">Contact Number</label>
                        <input type="tel" id="edit_contact" name="contact_number" required>
                    </div>

                    <div class="form-group">
                        <label for="edit_address">Address</label>
                        <textarea id="edit_address" name="address" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="edit_role">Role</label>
                        <select id="edit_role" name="role" required>
                            <option value="admin">Admin</option>
                            <option value="organizer">Organizer</option>
                            <option value="customer">Customer</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="edit_password">New Password (leave blank to keep current)</label>
                        <input type="password" id="edit_password" name="password">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="update-btn">Update User</button>
                        <a href="admin_users.html" class="cancel-link">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        // Check if user is logged in as admin
        function checkAdminAuth() {
            fetch('check_admin.php')
                .then(response => response.json())
                .then(data => {
                    if (!data.isAdmin) {
                        window.location.href = 'login.html';
                    } else {
                        loadUserData();
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    window.location.href = 'login.html';
                });
        }

        // Load user data
        function loadUserData() {
            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('id');

            if (!userId) {
                window.location.href = 'admin_users.html';
                return;
            }

            fetch(`get_user.php?id=${userId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const user = data.user;
                        document.getElementById('edit_user_id').value = user.id;
                        document.getElementById('edit_fullname').value = user.fullname;
                        document.getElementById('edit_email').value = user.email;
                        document.getElementById('edit_contact').value = user.contact_number;
                        document.getElementById('edit_address').value = user.address;
                        document.getElementById('edit_role').value = user.role;
                    } else {
                        alert(data.message);
                        window.location.href = 'admin_users.html';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error loading user data');
                    window.location.href = 'admin_users.html';
                });
        }

        // Update user function
        function updateUser(event) {
            event.preventDefault();
            const formData = new FormData(event.target);

            fetch('edit_user.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert(data.message);
                    window.location.href = 'admin_users.html';
                } else {
                    alert(data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred while updating the user');
            });
        }

        // Check admin authentication when page loads
        document.addEventListener('DOMContentLoaded', checkAdminAuth);
    </script>
</body>
</html>
